nv set system hostname border01
nv set interface lo ip address 10.0.0.9/32
nv set interface lo type loopback
nv set interface swp1-3 type swp
nv set interface swp2 bridge domain br_default access 10
nv set interface swp3 bridge domain br_default access 10
nv set bridge domain br_default vlan 10
nv set interface vlan10 ip address 172.31.1.0/31
nv set vrf default router static 203.0.113.0/31 via 172.31.1.1
nv set vrf default router static 203.0.113.100/32 via blackhole
nv set router policy prefix-list PUBLIC-OUT rule 10 action permit
nv set router policy prefix-list PUBLIC-OUT rule 10 match 203.0.113.100/32
nv set router policy prefix-list DEFAULT-IN rule 10 action permit
nv set router policy prefix-list DEFAULT-IN rule 10 match 0.0.0.0/0
nv set router policy route-map RM-EDGE-OUT rule 10 action permit
nv set router policy route-map RM-EDGE-OUT rule 10 match type ipv4
nv set router policy route-map RM-EDGE-OUT rule 10 match ip-prefix-list PUBLIC-OUT
nv set router policy route-map RM-EDGE-IN rule 10 action permit
nv set router policy route-map RM-EDGE-IN rule 10 match type ipv4
nv set router policy route-map RM-EDGE-IN rule 10 match ip-prefix-list DEFAULT-IN
nv set router bgp autonomous-system 65401
nv set router bgp enable on
nv set router bgp router-id 10.0.0.9
nv set vrf default router bgp address-family ipv4-unicast enable on
nv set vrf default router bgp address-family ipv4-unicast redistribute connected enable on
nv set vrf default router bgp address-family ipv4-unicast redistribute static enable on
nv set vrf default router bgp path-selection multipath aspath-ignore on
nv set vrf default router bgp enable on
nv set vrf default router bgp neighbor swp1 remote-as external
nv set vrf default router bgp neighbor swp1 type unnumbered
nv set vrf default router bgp neighbor 203.0.113.1 remote-as external
nv set vrf default router bgp neighbor 203.0.113.1 multihop-ttl 2
nv set vrf default router bgp neighbor 203.0.113.1 update-source vlan10
nv set vrf default router bgp neighbor 203.0.113.1 address-family ipv4-unicast policy outbound route-map RM-EDGE-OUT
nv set vrf default router bgp neighbor 203.0.113.1 address-family ipv4-unicast policy inbound route-map RM-EDGE-IN
nv set vrf default router bgp neighbor 203.0.113.1 address-family ipv4-unicast soft-reconfiguration on
nv set system api state enabled
nv set system config auto-save state enabled
nv set system control-plane acl acl-default-dos inbound
nv set system control-plane acl acl-default-whitelist inbound
nv set system reboot mode cold
nv set system ssh-server state enabled
