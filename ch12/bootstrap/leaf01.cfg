nv set system hostname leaf01
nv set interface lo ip address 10.0.0.1/32
nv set interface lo type loopback
nv set interface swp1-2 type swp
nv set interface swp1 ip address 172.16.1.1/24
nv set router policy prefix-list HOSTS-IN rule 10 action permit
nv set router policy prefix-list HOSTS-IN rule 10 match 172.16.200.0/24 min-prefix-len 32
nv set router policy prefix-list HOSTS-IN rule 10 match 172.16.200.0/24 max-prefix-len 32
nv set router policy route-map RM-HOSTS-IN rule 10 action permit
nv set router policy route-map RM-HOSTS-IN rule 10 match type ipv4
nv set router policy route-map RM-HOSTS-IN rule 10 match ip-prefix-list HOSTS-IN
nv set router bgp autonomous-system 65101
nv set router bgp enable on
nv set router bgp router-id 10.0.0.1
nv set vrf default router bgp address-family ipv4-unicast enable on
nv set vrf default router bgp address-family ipv4-unicast redistribute connected enable on
nv set vrf default router bgp path-selection multipath aspath-ignore on
nv set vrf default router bgp enable on
nv set vrf default router bgp neighbor swp1 remote-as external
nv set vrf default router bgp neighbor swp1 type unnumbered
nv set vrf default router bgp neighbor swp1 address-family ipv4-unicast policy inbound route-map RM-HOSTS-IN
nv set vrf default router bgp neighbor swp1 address-family ipv4-unicast prefix-limits inbound maximum 5
nv set vrf default router bgp neighbor swp1 address-family ipv4-unicast soft-reconfiguration on
nv set vrf default router bgp neighbor swp2 remote-as external
nv set vrf default router bgp neighbor swp2 type unnumbered
nv set system api state enabled
nv set system config auto-save state enabled
nv set system control-plane acl acl-default-dos inbound
nv set system control-plane acl acl-default-whitelist inbound
nv set system reboot mode cold
nv set system ssh-server state enabled
