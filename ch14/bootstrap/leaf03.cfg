nv set system hostname leaf03
nv set interface lo ip address 10.0.0.3/32
nv set interface lo type loopback
nv set interface swp1-6 type swp
nv set bridge domain br_default vlan 100
nv set interface swp1 bridge domain br_default access 100
nv set interface swp2 bridge domain br_default access 100
nv set interface swp3 bridge domain br_default access 100
nv set interface swp4 bridge domain br_default access 100
nv set interface vlan100 ip address 172.16.3.1/24
nv set router bgp autonomous-system 65103
nv set router bgp enable on
nv set router bgp router-id 10.0.0.3
nv set vrf default router bgp address-family ipv4-unicast enable on
nv set vrf default router bgp address-family ipv4-unicast redistribute connected enable on
nv set vrf default router bgp path-selection multipath aspath-ignore on
nv set vrf default router bgp enable on
nv set vrf default router bgp neighbor swp5 remote-as external
nv set vrf default router bgp neighbor swp5 type unnumbered
nv set vrf default router bgp neighbor swp6 remote-as external
nv set vrf default router bgp neighbor swp6 type unnumbered
nv set system api state enabled
nv set system config auto-save state enabled
nv set system control-plane acl acl-default-dos inbound
nv set system control-plane acl acl-default-whitelist inbound
nv set system reboot mode cold
nv set system ssh-server state enabled
