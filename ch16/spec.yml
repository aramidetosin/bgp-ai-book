# Chapter 16: the failure-modes fabric. The standard chapter 6 underlay
# (4 leafs, 2 spines, eBGP unnumbered), but with a server on every leaf,
# so the four servers form a heartbeat mesh that stands in for a
# collective library's step timing. Failures are injected on the fabric
# links; BFD is applied post-deploy (bfd.sh) so the lab can show the
# detection ladder chapter 6 measured (hold-timer slow vs BFD fast).
name: bgpbook-ch16
mgmt_subnet: 172.20.46.0/24

leafs: 4
spines: 2
servers_on: [1, 2, 3, 4]   # a server on every leaf: a four-node heartbeat mesh

switch_image: vrnetlab/nvidia_cumulus-vx:5.12.0
node_image: bgpbook-multitool-lldpd

spine_asn: 65100
leaf_asn_base: 65100   # leaf i gets leaf_asn_base + i
